name: Build

on:
  push:
    branches-ignore: ['ci-logs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittleCloud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots (Android emulator)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/screenshots-android.sh
      - name: Publish log
        if: always()
        shell: bash
        run: .github/publish-log.sh android "${{ job.status }}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
      - name: Build iOS framework (simulator)
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:linkDebugFrameworkIosSimulatorArm64 :app:iosSimulatorArm64Test 2>&1 | tee build.log
      - name: Generate Xcode project
        shell: bash
        run: |
          brew install xcodegen >/dev/null
          cd iosApp && xcodegen 2>&1 | tee -a ../build.log
      - name: Build iOS app (simulator)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath build/dd build 2>&1 | tee -a build.log | tail -80
      - name: Screenshots (iOS simulator)
        shell: bash
        run: bash .github/screenshots-ios.sh 2>&1 | tee -a build.log
      - name: Publish log
        if: always()
        shell: bash
        run: .github/publish-log.sh ios "${{ job.status }}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
